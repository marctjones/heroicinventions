; Export presets for the release build (issue #99). Built by tools/release.sh.
; Only the macOS preset has been exercised; Windows and Linux are written to the same
; filters but are untested until their export templates are installed (docs/release.md).

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="machines/*.machine, worlds/*.world, maps/*.map, lessons/*.lesson, routes/*.route, routes/*/*.route, meshes/*.glb, meshes/catalogue/*.glb, meshes/catalogue/catalogue.rktd, icons/*.png"
exclude_filter="*.md, *.rkt, *.rktd.bak, tests/*, racket/*, *.tmp"
export_path="../dist/macos/HeroicInventions.zip"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
application/icon=""
application/icon_interpolation=4
application/bundle_identifier="com.heroicinventions.game"
application/signature=""
application/app_category="Games"
application/short_version="0.2.0"
application/version="0.2.0-alpha"
application/copyright=""
display/high_res=true
application/min_macos_version_x86_64="10.15"
application/min_macos_version_arm64="11.00"
binary_format/architecture="universal"
codesign/codesign=0
codesign/installer_identity=""
codesign/apple_team_id=""
codesign/identity=""
codesign/entitlements/custom_file=""
codesign/entitlements/allow_jit_code_execution=true
codesign/entitlements/allow_unsigned_executable_memory=true
codesign/entitlements/allow_dyld_environment_variables=false
codesign/entitlements/disable_library_validation=true
notarization/notarization=0
privacy/microphone_usage_description=""
privacy/camera_usage_description=""
ssh_remote_deploy/enabled=false


